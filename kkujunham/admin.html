<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1D9E75;--gd:#158A62;--gl:#E8F7F2;--dark:#0F1A16;--bg:#F4F7F5;--bd:#E2EAE6;--tx:#1C1917;--mu:#6B7280}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hd{background:var(--dark);padding:0 22px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hd-l{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px}
.hd-l em{color:var(--green);font-style:normal}
.badge{background:rgba(29,158,117,.2);border:1px solid rgba(29,158,117,.4);color:#7FFFD4;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600}
.hd-r{display:flex;align-items:center;gap:10px}
.ver{font-size:12px;color:rgba(255,255,255,.35)}
.btn-dl{padding:7px 16px;background:var(--green);border:none;border-radius:7px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.btn-dl:hover{background:var(--gd)}
.main{display:flex;flex:1;overflow:hidden}

/* CHAT */
.cp{width:360px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--bd)}
.ch{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;flex-shrink:0}
.ch::before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%;animation:bl 2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.qbs{padding:9px 12px;border-bottom:1px solid var(--bd);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.qb{padding:4px 10px;background:var(--gl);border:1px solid rgba(29,158,117,.2);border-radius:100px;font-size:11px;color:var(--gd);cursor:pointer;font-family:inherit;font-weight:600}
.qb:hover{background:#c6edd9}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.msg{display:flex;flex-direction:column;gap:3px}
.mu{align-items:flex-end}.ma{align-items:flex-start}
.ml{font-size:11px;color:var(--mu);padding:0 4px}
.bbl{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.7}
.mu .bbl{background:var(--green);color:#fff;border-radius:13px 13px 4px 13px}
.ma .bbl{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:13px 13px 13px 4px}
.typ{display:inline-flex;align-items:center;gap:4px;padding:10px 13px;background:var(--bg);border:1px solid var(--bd);border-radius:13px 13px 13px 4px}
.typ span{width:6px;height:6px;background:var(--mu);border-radius:50%;animation:dt 1.4s ease-in-out infinite}
.typ span:nth-child(2){animation-delay:.2s}.typ span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.1);opacity:1}}
.iw{padding:11px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
textarea{flex:1;border:1.5px solid var(--bd);border-radius:11px;padding:9px 13px;font-size:13px;font-family:inherit;resize:none;outline:none;max-height:110px;color:var(--tx);line-height:1.55;background:var(--bg);transition:border-color .2s}
textarea:focus{border-color:var(--green);background:#fff}
.sb{width:40px;height:40px;background:var(--green);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.sb:hover{background:var(--gd)}
.sb:disabled{background:#ccc;cursor:not-allowed}
.sb svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* PREVIEW */
.pp{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pb{padding:9px 14px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px;flex-shrink:0}
.dots{display:flex;gap:5px}
.dots span{width:11px;height:11px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febc2e}.dg{background:#28c840}
.pu{flex:1;background:#f3f4f6;border-radius:6px;padding:5px 12px;font-size:12px;color:#9ca3af;text-align:center}
.ps{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sd{width:7px;height:7px;border-radius:50%;background:#22c55e}
.sd.on{background:#f59e0b;animation:bl 1s ease-in-out infinite}
.fw{flex:1;overflow:hidden;position:relative;background:#e5e7eb}
iframe#pv{width:1440px;height:900px;border:none;transform-origin:top left;position:absolute;top:0;left:0;background:#fff}

.toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.tok{background:var(--green)}.terr{background:#e53e3e}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-l"><em>꾸준함</em> AI 관리자<div class="badge">Claude AI</div></div>
  <div class="hd-r">
    <span class="ver" id="ver">v1</span>
    <button class="btn-dl" onclick="dl()">⬇ index.html 저장</button>
  </div>
</div>
<div class="main">

    <div class="qbs">

    <div class="msgs" id="msgs">
      <div class="msg ma"><div class="ml">AI</div><div class="bbl">안녕하세요! 수정 요청을 입력하면 오른쪽 미리보기에 바로 반영돼요.<br><br>예시<br>• "히어로 제목 바꿔줘"<br>• "버튼 텍스트 수정해줘"<br>• "배너 내용 변경해줘"</div></div>
    </div>
    <div class="iw">
      <textarea id="inp" placeholder="수정 요청 입력... (Enter 전송)" rows="1" onkeydown="kd(event)" oninput="ar(this)"></textarea>
      <button class="sb" id="sb" onclick="go()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
  <div class="pp">
    <div class="pb">
      <div class="dots"><span class="dr"></span><span class="dy"></span><span class="dg"></span></div>
      <div class="pu">꾸준함 홈페이지 미리보기</div>
      <div class="ps"><div class="sd" id="sd"></div><span id="st">준비됨</span></div>
    </div>
    <div class="fw" id="fw"><iframe id="pv" sandbox="allow-scripts allow-same-origin"></iframe></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var H="<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\uafb8\uc900\ud568 \u2014 \ub0b4\uc2e0 \ub300\ube44 \uc218\ud559\ubb38\uc81c\uc740\ud589<\/title>\n<style>\n  /* \u2500\u2500 S-Core Dream \ud3f0\ud2b8 \u2500\u2500 */\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream1.otf') format('opentype'); font-weight:100; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream2.otf') format('opentype'); font-weight:200; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream3.otf') format('opentype'); font-weight:300; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream4.otf') format('opentype'); font-weight:400; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream5.otf') format('opentype'); font-weight:500; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream6.otf') format('opentype'); font-weight:600; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream7.otf') format('opentype'); font-weight:700; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream8.otf') format('opentype'); font-weight:800; font-display:swap; }\n  @font-face { font-family:'SCDream'; src:url('fonts/SCDream9.otf') format('opentype'); font-weight:900; font-display:swap; }\n\n  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }\n  :root {\n    --green:#1D9E75; --green-dark:#158A62; --green-light:#E8F7F2;\n    --dark:#0F1A16; --text:#1C1917; --muted:#6B7280; --border:#E5E7EB;\n  }\n  html { scroll-behavior:smooth; }\n  body { font-family:'SCDream', sans-serif; background:#fff; color:var(--text); overflow-x:hidden; font-weight:400; }\n\n  /* \u2500\u2500 NAV \u2500\u2500 */\n  .nav { position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 52px;height:64px;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(29,158,117,.12); }\n  .nav-logo { font-size:20px;font-weight:900;color:var(--dark);letter-spacing:-0.5px;text-decoration:none; }\n  .nav-logo span { color:var(--green); }\n  .nav-links { display:flex;gap:32px;list-style:none;font-size:14px;color:#444;font-weight:400; }\n  .nav-links a { color:inherit;text-decoration:none;transition:color .2s; }\n  .nav-links a:hover { color:var(--green); }\n  .nav-actions { display:flex;gap:10px; }\n  .btn-ghost { padding:9px 20px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;color:var(--text);background:#fff;cursor:pointer;font-family:'SCDream',sans-serif;font-weight:400;transition:border-color .2s,color .2s; }\n  .btn-ghost:hover { border-color:var(--green);color:var(--green); }\n  .btn-primary { padding:9px 22px;background:var(--green);border:none;border-radius:8px;font-size:13.5px;font-weight:700;color:#fff;cursor:pointer;font-family:'SCDream',sans-serif;transition:background .2s,transform .1s; }\n  .btn-primary:hover { background:var(--green-dark);transform:translateY(-1px); }\n\n  /* \u2500\u2500 HERO \u2500\u2500 */\n  .hero { position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center; }\n\n  /* YouTube \ubc30\uacbd (\ud37c\uac00\uae30 \ud5c8\uc6a9 \ud6c4 display:none \u2192 block) */\n  .video-bg { display:block;position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden; }\n  .video-bg iframe { position:absolute;top:50%;left:50%;width:177.78vh;min-width:100%;height:100%;min-height:56.25vw;transform:translate(-50%,-50%);border:none; }\n\n  /* CSS \ubc30\uacbd (\uc784\uc2dc) */\n  .animated-bg { position:absolute;inset:0;z-index:0;background:var(--dark);overflow:hidden; }\n  .orb { position:absolute;border-radius:50%;filter:blur(80px);opacity:0.45;animation:float linear infinite; }\n  .orb-1 { width:600px;height:600px;background:#1D9E75;top:-10%;left:-15%;animation-duration:22s; }\n  .orb-2 { width:500px;height:500px;background:#0F6E56;top:30%;right:-10%;animation-duration:28s;animation-delay:-8s; }\n  .orb-3 { width:400px;height:400px;background:#1D9E75;bottom:-15%;left:35%;animation-duration:20s;animation-delay:-4s; }\n  .orb-4 { width:300px;height:300px;background:#085041;top:15%;left:45%;animation-duration:25s;animation-delay:-12s; }\n  @keyframes float { 0%{transform:translate(0,0) scale(1)}25%{transform:translate(40px,-60px) scale(1.05)}50%{transform:translate(-30px,30px) scale(.95)}75%{transform:translate(50px,50px) scale(1.08)}100%{transform:translate(0,0) scale(1)} }\n\n  .grid-pattern { position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px; }\n  .particles { position:absolute;inset:0;z-index:1;overflow:hidden; }\n  .particle { position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(29,158,117,.7);animation:rise linear infinite; }\n  @keyframes rise { 0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-100vh) translateX(var(--drift,20px));opacity:0} }\n\n  .hero-overlay { position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(15,26,22,.3) 0%,rgba(15,26,22,.1) 45%,rgba(15,26,22,.58) 100%); }\n  .hero-content { position:relative;z-index:3;display:flex;flex-direction:column;align-items:center; }\n\n  .hero-badge { display:inline-flex;align-items:center;gap:8px;background:rgba(29,158,117,.22);border:1px solid rgba(29,158,117,.55);color:#7FFFD4;padding:7px 20px;border-radius:100px;font-size:13px;font-weight:500;margin-bottom:28px;backdrop-filter:blur(8px); }\n  .hero-badge::before { content:'';width:7px;height:7px;background:#1D9E75;border-radius:50%;animation:pulse 2s ease-in-out infinite; }\n  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)} }\n\n  .hero h1 { font-size:clamp(40px,5.5vw,72px);font-weight:900;color:#fff;line-height:1.15;letter-spacing:-1px;margin-bottom:20px; }\n  .hero h1 em { font-style:normal;color:#5DCAA5; }\n  .hero-sub { font-size:clamp(15px,1.5vw,19px);color:rgba(255,255,255,.78);margin-bottom:46px;line-height:1.8;font-weight:300; }\n\n  .hero-btns { display:flex;gap:14px; }\n  .btn-hero-main { padding:17px 44px;background:var(--green);border:none;border-radius:50px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:'SCDream',sans-serif;box-shadow:0 8px 32px rgba(29,158,117,.5);transition:background .2s,transform .15s,box-shadow .2s; }\n  .btn-hero-main:hover { background:var(--green-dark);transform:translateY(-2px);box-shadow:0 14px 44px rgba(29,158,117,.55); }\n  .btn-hero-sub { padding:17px 40px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.4);border-radius:50px;font-size:16px;font-weight:500;color:#fff;cursor:pointer;font-family:'SCDream',sans-serif;backdrop-filter:blur(8px);transition:background .2s,transform .15s; }\n  .btn-hero-sub:hover { background:rgba(255,255,255,.2);transform:translateY(-2px); }\n\n  .video-notice { position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.5);border:1px solid rgba(29,158,117,.4);color:rgba(255,255,255,.7);padding:8px 20px;border-radius:100px;font-size:12px;backdrop-filter:blur(8px);white-space:nowrap;font-weight:300; }\n  .video-notice span { color:#5DCAA5;font-weight:500; }\n\n  .mute-btn { display:none;position:absolute;bottom:32px;right:40px;z-index:10;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.38);color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:background .2s; }\n\n  .scroll-hi
